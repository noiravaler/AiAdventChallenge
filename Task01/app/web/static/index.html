<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Чат</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #d9dcdd;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }

  /* Окно приложения, как на референсе: скруглённая «телефонная» карточка */
  .app {
    width: min(430px, 100%);
    height: min(780px, calc(100vh - 32px));
    min-height: 480px;
    background: #3f93a4;
    border-radius: 26px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 24px 60px rgba(30, 60, 70, .35);
  }

  /* Шапка: аватар, название, кнопка нового диалога */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    background: #2e7f8f;
  }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #dff0f4;
    color: #2e7f8f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .5px;
    flex: none;
  }
  .titles { min-width: 0; }
  .name { color: #fff; font-size: 15px; font-weight: 600; line-height: 1.2; }
  .status {
    color: #c9e6ec;
    font-size: 12px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status.typing { font-style: italic; }
  .newchat {
    margin-left: auto;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 0;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #dff0f4;
    flex: none;
  }
  .newchat:hover { background: rgba(255, 255, 255, .14); }
  .newchat:active { background: rgba(255, 255, 255, .24); }
  .newchat svg { display: block; }

  /* Лента сообщений */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 10px;
    background: #3f93a4;
  }
  .divider {
    text-align: center;
    color: #cfe9ee;
    font-size: 12px;
    margin: 4px 0 12px;
  }
  .row { display: flex; margin: 0 0 10px; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 14px;
    line-height: 1.45;
    color: #143a44;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .row.ai .bubble { background: #dff0f4; }
  .row.user .bubble { background: #fff; }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #bfe0e8;
    align-self: flex-end;
    margin: 0 2px 5px 6px;
    flex: none;
  }
  .errline {
    text-align: center;
    color: #ffe2e2;
    font-size: 12px;
    margin: 2px 0 10px;
  }

  /* Панель ввода */
  .inputbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: #fff;
  }
  .inputbar input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: #dff0f4;
    border-radius: 22px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    color: #143a44;
  }
  .inputbar input::placeholder { color: #7fa8b3; }
  .inputbar input:focus { box-shadow: 0 0 0 2px rgba(46, 127, 143, .35); }
  .send {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 0;
    background: #2e7f8f;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex: none;
  }
  .send:hover { background: #287180; }
  .send:disabled { background: #9cc4cd; cursor: default; }
  .send svg { display: block; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="avatar">AI</div>
    <div class="titles">
      <div class="name">AI Чат</div>
      <div class="status" id="status">загрузка…</div>
    </div>
    <button class="newchat" id="newChat" title="Новый диалог — очистить историю" aria-label="Новый диалог">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </header>

  <main class="log" id="log">
    <div class="divider" id="todayDivider">Сегодня</div>
  </main>

  <footer class="inputbar">
    <input id="input" type="text" placeholder="Сообщение…" autocomplete="off" autofocus>
    <button class="send" id="send" title="Отправить" aria-label="Отправить">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.4 20.4 22 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/>
      </svg>
    </button>
  </footer>
</div>

<script>
  const log = document.getElementById('log');
  const input = document.getElementById('input');
  const send = document.getElementById('send');
  const newChatBtn = document.getElementById('newChat');
  const statusEl = document.getElementById('status');
  const todayDivider = document.getElementById('todayDivider');

  const scrollDown = () => { log.scrollTop = log.scrollHeight; };

  function addRow(role, text) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    if (role === 'user') {
      const dot = document.createElement('div');
      dot.className = 'dot';
      row.appendChild(dot);
    }
    log.appendChild(row);
    scrollDown();
    return bubble;
  }

  function addError(text) {
    const div = document.createElement('div');
    div.className = 'errline';
    div.textContent = 'Ошибка: ' + text;
    log.appendChild(div);
    scrollDown();
  }

  function setBusy(busy) {
    send.disabled = busy;
    statusEl.classList.toggle('typing', busy);
    if (busy) {
      statusEl.dataset.saved = statusEl.textContent;
      statusEl.textContent = 'печатает…';
    } else if (statusEl.dataset.saved !== undefined) {
      statusEl.textContent = statusEl.dataset.saved;
      delete statusEl.dataset.saved;
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || send.disabled) return;

    addRow('user', text);
    input.value = '';
    setBusy(true);

    const bubble = addRow('ai', '');
    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      if (!resp.ok) {
        const errText = (await resp.text()).trim();
        throw new Error(errText || ('HTTP ' + resp.status));
      }
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        bubble.textContent += decoder.decode(value, { stream: true });
        scrollDown();
      }
      if (!bubble.textContent) bubble.remove();
    } catch (err) {
      bubble.remove();
      addError(err.message || err);
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  async function newDialog() {
    if (send.disabled) return;
    try {
      await fetch('/api/reset', { method: 'POST' });
    } catch (err) {
      addError(err.message || err);
      return;
    }
    log.innerHTML = '';
    log.appendChild(todayDivider);
  }

  (async function init() {
    try {
      const info = await (await fetch('/api/info')).json();
      document.title = 'AI Чат — ' + info.model;
      statusEl.textContent = info.model;
      const data = await (await fetch('/api/history')).json();
      for (const m of data.messages) {
        addRow(m.role === 'user' ? 'user' : 'ai', m.content);
      }
    } catch (err) {
      statusEl.textContent = 'нет связи с сервером';
    }
  })();

  send.addEventListener('click', sendMessage);
  newChatBtn.addEventListener('click', newDialog);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) sendMessage();
  });
</script>
</body>
</html>
